<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ランダム勇者と魔王のカード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d1e;--win:#101633;--line:#f2f2f2;--gold:#ffd84a;--red:#ff5a5a;--green:#6dff8a;--blue:#7fc8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:#fff;font-family:'DotGothic16',monospace}
body{min-height:100vh;display:flex;justify-content:center;background-image:radial-gradient(#1b2150 1px,transparent 1px);background-size:8px 8px}
#app{width:100%;max-width:480px;padding:10px;display:flex;flex-direction:column;gap:10px}
.win{background:var(--win);border:3px solid var(--line);border-radius:6px;box-shadow:0 0 0 3px #000,inset 0 0 0 2px #000;padding:8px 10px}
.head{display:flex;align-items:center;justify-content:center;gap:8px;position:relative}
h1{font-size:19px;text-align:center;margin:2px 0;color:var(--gold);text-shadow:2px 2px 0 #7a3b00;letter-spacing:1px;font-weight:normal}
#mute{position:absolute;right:0;top:-2px;font-size:14px;padding:4px 7px;border-width:2px;box-shadow:0 2px 0 #000}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.hero-top{display:flex;gap:10px;align-items:center}
.hero-top .info{flex:1}
.name{font-size:15px;display:flex;justify-content:space-between}
.hpbar{height:10px;border:2px solid #fff;background:#300;margin-top:3px;position:relative}
.hpbar i{position:absolute;left:0;top:0;bottom:0;background:var(--green);transition:width .35s}
.hpbar i.low{background:var(--red)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px 14px;font-size:13px;margin-top:6px}
.stats div{display:flex;justify-content:space-between}
.stats .v{color:var(--gold)}
.plus{color:var(--green);font-size:11px;margin-left:3px}
.sub{font-size:12px;color:#b9c3ff;margin-top:5px;line-height:1.5}
#allies{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
#allies .al{display:flex;align-items:center;gap:2px;font-size:11px;color:#ffe9a8}
#stage{position:relative;min-height:270px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;text-align:center}
#stage.king{background:#2a0610}
.center{display:flex;flex-direction:column;align-items:center;gap:8px}
.note{font-size:13px;color:#cfd6ff;line-height:1.6}
.deck{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:420px}
.mc{width:22px;height:30px;border:2px solid #fff;border-radius:3px;font-size:11px;display:flex;align-items:center;justify-content:center;background:#3a1a6b}
.mc.done{background:#333;color:#999;border-color:#777}
.mc.cur{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.mc.king{background:#7a0c1a;color:#fff}
.mc.w{background:#3b1a5c;color:#d9b3ff;border-color:#b46bff}
.card{width:120px;height:168px;perspective:600px}
.card .in{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.card.flipped .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid #fff;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:0 0 0 3px #000}
.card .b{background:repeating-linear-gradient(45deg,#3a1a6b 0 8px,#2a1050 8px 16px);font-size:40px;color:var(--gold);text-shadow:3px 3px 0 #000;transition:box-shadow .4s}
.card .f{background:#1a0d0d;transform:rotateY(180deg)}
.card.kingcard .b{background:repeating-linear-gradient(45deg,#6b0c1a 0 8px,#45040e 8px 16px)}
.card.sage .b{box-shadow:0 0 0 3px #000,0 0 34px 14px #ffd84a;border-color:var(--gold)}
@keyframes tremble{0%,100%{transform:rotate(0) translateX(0)}25%{transform:rotate(-2deg) translateX(-2px)}75%{transform:rotate(2deg) translateX(2px)}}
.tremble{animation:tremble .08s 5}
.card.sage{animation:tremble .07s infinite}
.ename{font-size:16px;color:#fff}
.ename.k{color:var(--red)}
.ebox{width:84%}
.estats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px 6px;font-size:11px;color:#cfd6ff;margin-top:4px;width:100%}
.estats span b{color:#fff;font-weight:normal}
@keyframes ghost{50%{opacity:.45;transform:translateX(2px)}}
.ghostly{animation:ghost 1.1s infinite}
#msg{min-height:122px;font-size:15px;line-height:1.55;position:relative}
#msg p{margin:0}
#msg p.dmg{color:#ffb3b3}
#msg p.good{color:var(--green)}
#msg p.gold{color:var(--gold)}
#msg p.purple{color:#d9b3ff}
#speed{position:absolute;right:6px;bottom:6px;font-size:11px;padding:3px 6px;box-shadow:none;border-width:2px}
#controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;min-height:56px}
#controls.one{grid-template-columns:1fr}
#controls.two{grid-template-columns:1fr 1fr}
button{font-family:inherit;font-size:17px;color:#fff;background:#1d2a66;border:3px solid #fff;border-radius:4px;padding:11px 6px;box-shadow:0 4px 0 #000;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
button.red{background:#7a1f1f}
button small{display:block;font-size:10px;color:#cfd6ff;margin-top:2px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .12s 3}
@keyframes quake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(4px,4px)}}
.quake{animation:quake .1s 8}
@keyframes blink{50%{opacity:0}}
.blink{animation:blink .1s 4}
@keyframes flash{0%{background:#a00}100%{background:var(--win)}}
.flash{animation:flash .35s}
@keyframes healfx{0%{background:#0a5a2a}100%{background:var(--win)}}
.healfx{animation:healfx .6s}
@keyframes pop{0%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-46px);opacity:0}}
.pop{position:absolute;left:50%;top:40%;font-size:24px;color:#fff;text-shadow:2px 2px 0 #000,-2px -2px 0 #000;animation:pop 1s forwards;pointer-events:none;white-space:nowrap;z-index:3}
.pop.crit{color:var(--gold);font-size:28px}
.pop.mag{color:#c9a6ff}
.itemget{position:absolute;inset:0;background:rgba(0,0,0,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:15px;color:var(--gold);z-index:4}
.itemget.sage{background:radial-gradient(circle,rgba(255,216,74,.45),rgba(0,0,0,.85) 70%);font-size:20px}
@keyframes glow{from{filter:drop-shadow(0 0 4px #ffd84a)}to{filter:drop-shadow(0 0 18px #fff6b0)}}
.itemget.sage canvas{animation:glow .4s infinite alternate}
.big{font-size:30px;color:var(--gold);text-shadow:3px 3px 0 #7a3b00}
.dead canvas{filter:grayscale(1) brightness(.6)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .6s}
body.tense::after{opacity:1;box-shadow:inset 0 0 95px 26px var(--tc,rgba(255,0,0,.55));animation:pulse .43s infinite alternate}
@keyframes pulse{from{filter:brightness(.6)}to{filter:brightness(1.3)}}
.warn{position:absolute;top:6px;left:0;right:0;color:var(--red);font-size:20px;letter-spacing:4px;text-shadow:2px 2px 0 #000;animation:blink .5s infinite;z-index:2}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s;z-index:9}
#bolt{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:10}
#msg p.gray{color:#b8b8b8}
/* 絶望の演出（創造神） */
body.despair{background:#000}
body.despair #heroPanel,body.despair #msg,body.despair #controls{filter:grayscale(1) brightness(.75);transition:filter 2s}
body.despair #stage{background:#000 !important}
body.despair h1{color:#777;text-shadow:none;transition:color 2s}
body.despair.tense::after{animation:pulse 2.4s infinite alternate}
@keyframes ash{from{transform:translateY(-10px);opacity:0}20%{opacity:.8}to{transform:translateY(300px);opacity:0}}
.ash{position:absolute;top:0;width:3px;height:3px;background:#999;animation:ash linear infinite;pointer-events:none}
.warn.gray{color:#ccc;animation:blink 1.6s infinite}
</style>
</head>
<body>
<div id="dim"></div><div id="bolt"></div>
<div id="app">
  <div class="head"><h1>⚔ ランダム勇者と魔王のカード ⚔</h1><button id="mute">🔊</button></div>
  <div class="win" id="heroPanel">
    <div class="hero-top">
      <canvas id="heroCv"></canvas>
      <div class="info">
        <div class="name"><span id="heroName">勇者</span><span id="hpTxt">1 / 1</span></div>
        <div class="hpbar"><i id="hpBar" style="width:100%"></i></div>
      </div>
    </div>
    <div class="stats" id="heroStats"></div>
    <div class="sub" id="equipTxt"></div>
    <div class="sub" id="allies"></div>
  </div>
  <div class="win" id="stage"></div>
  <div class="win" id="msg"></div>
  <div id="controls"></div>
</div>

<script>
// ===== 調整用の数値 =====
const CFG = {
  lowRate: 0.90,                  // 勇者の各ステータス：90%で1〜100
  lowMin: 1, lowMax: 100,
  highMin: 100, highMax: 10000,   //                     10%で100〜10000
  luckRef: 1000,                  // 運がこの値で 会心・ドロップ率が最大
  defPower: 3,                    // 防御力の効き（大きいほど防御が強い。以前は1）
  recruitMin: 0.02, recruitMax: 1.00, recruitLuck: 10000, // 仲間にする確率：2%〜、運10000で100%（運に比例）
  monMin: 100, monMax: 1000,      // 通常モンスター
  kingMin: 500, kingMax: 5000,    // 魔王
  cardsMin: 5, cardsMax: 10,      // 魔王までのカード枚数（魔王を含む）
  rareRate: 0.005,                // 裏ボス1体あたりの出現率 0.5%（カード1枚ごと）
  dropRate: 0.70,                 // 敵を倒したあとのアイテム出現率 70%
  sageRate: 0.01,                 // アイテムが賢者シリーズになる確率 1%
  sageBonus: 10000,               // 賢者の剣・防具のプラス値
  potionMin: 100, potionMax: 1000,// 回復ポーションの回復量
  totemRate: 0.001,               // 落としたアイテムがトーテム（一度だけ復活）になる確率 0.1%
  specialBirthRate: 0.000001,     // 破滅の王・女神・運のいいやつ それぞれの誕生率 0.0001%
  maxAllies: 3,
  itemMin: 10, itemMax: 10000,    // 装備のプラス値
  healRate: 0.10                  // 勝利後にHPが最大値の10%回復
};

const $ = s => document.querySelector(s);
const R = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const lk = l => Math.min(1, l / CFG.luckRef);
const KEYS = ['hp', 'atk', 'mag', 'luk', 'def', 'mdf'];
const LABEL = { hp: 'HP', atk: '攻撃力', mag: '魔力', luk: '運', def: '防御力', mdf: '魔法防御' };
const SHORT = { hp: 'HP', atk: '攻', mag: '魔', luk: '運', def: '防', mdf: '魔防' };

// ===== サウンド（Web Audioで合成） =====
let actx = null, master, musicGain, nbuf, muted = false, seq = null;
function ac() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.6; master.connect(actx.destination);
    musicGain = actx.createGain(); musicGain.gain.value = 0.55; musicGain.connect(master);
    nbuf = actx.createBuffer(1, actx.sampleRate * 3, actx.sampleRate);
    const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
function tone(freq, dur, o = {}) {
  const a = ac(); const t = o.at ?? a.currentTime;
  const os = a.createOscillator(), g = a.createGain();
  os.type = o.type || 'square'; os.frequency.setValueAtTime(freq, t);
  if (o.to) os.frequency.exponentialRampToValueAtTime(o.to, t + dur);
  g.gain.setValueAtTime(o.vol ?? 0.15, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  os.connect(g).connect(o.dest || master); os.start(t); os.stop(t + dur + 0.03);
}
function noise(dur, o = {}) {
  const a = ac(); const t = o.at ?? a.currentTime;
  const s = a.createBufferSource(); s.buffer = nbuf;
  const f = a.createBiquadFilter(); f.type = o.type || 'lowpass'; f.frequency.setValueAtTime(o.freq || 1000, t); f.Q.value = o.q || 1;
  if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + dur);
  const g = a.createGain(); g.gain.setValueAtTime(o.vol ?? 0.3, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  s.connect(f).connect(g).connect(o.dest || master); s.start(t); s.stop(t + dur + 0.05);
}
const now = () => ac().currentTime;
const SFX = {
  click() { tone(880, .05, { vol: .1 }); tone(1320, .06, { vol: .08, at: now() + .04 }); },
  tick() { tone(R(900, 1600), .025, { vol: .04 }); },
  suspense(i) { tone(mf(60 + i * 3), .09, { type: 'triangle', vol: .12 }); },
  flip() { noise(.3, { type: 'bandpass', freq: 600, to: 4000, q: 2, vol: .35 }); tone(520, .18, { type: 'triangle', to: 1040, vol: .15, at: now() + .12 }); },
  hit() { noise(.12, { freq: 900, vol: .4 }); tone(160, .15, { to: 50, vol: .22 }); },
  crit() { SFX.hit(); tone(1400, .12, { vol: .12, at: now() + .05 }); tone(1900, .15, { vol: .1, at: now() + .12 }); },
  magic() { const t = now(); [72, 76, 79, 84, 88].forEach((m, i) => tone(mf(m), .2, { type: 'triangle', vol: .12, at: t + i * .05 })); noise(.4, { type: 'highpass', freq: 3000, vol: .08, at: t + .1 }); },
  hurt() { tone(320, .28, { type: 'sawtooth', to: 70, vol: .2 }); noise(.15, { freq: 500, vol: .3 }); },
  talk() { const t = now(); [0, 1, 2].forEach(i => tone(mf(R(72, 84)), .06, { vol: .06, at: t + i * .08 })); },
  item() { const t = now(); [72, 76, 79, 84].forEach((m, i) => tone(mf(m), .25, { vol: .1, at: t + i * .1 })); },
  heal() { const t = now(); [76, 79, 83, 88, 91].forEach((m, i) => tone(mf(m), .3, { type: 'sine', vol: .14, at: t + i * .07 })); },
  rise(i) { tone(mf(60 + i * 5), .4, { type: 'sawtooth', to: mf(64 + i * 5), vol: .09 }); noise(.3, { type: 'highpass', freq: 4000 + i * 1500, vol: .05 }); SFX.heart(); },
  sage() {
    const t = now();
    [[60, 64, 67], [65, 69, 72], [67, 71, 74], [72, 76, 79, 84]].forEach((ch, i) =>
      ch.forEach(m => tone(mf(m), i === 3 ? 1.4 : .32, { type: i === 3 ? 'triangle' : 'square', vol: .07, at: t + i * .3 })));
    noise(1.6, { type: 'highpass', freq: 6000, vol: .06, at: t + .9 });
  },
  join() { const t = now(); [67, 72, 76, 79, 76, 84].forEach((m, i) => tone(mf(m), .22, { type: 'triangle', vol: .14, at: t + i * .11 })); },
  win() { const t = now(); [72, 72, 72, 76, 79, 84].forEach((m, i) => tone(mf(m), i === 5 ? .6 : .14, { vol: .12, at: t + [0, .12, .24, .36, .5, .7][i] })); },
  lose() { const t = now(); [67, 63, 60, 55].forEach((m, i) => tone(mf(m), .45, { type: 'triangle', vol: .15, at: t + i * .35 })); },
  heart() { const t = now(); tone(70, .18, { type: 'sine', to: 40, vol: .7, at: t }); tone(65, .2, { type: 'sine', to: 38, vol: .5, at: t + .22 }); },
  thunder() {
    const t = now();
    noise(.25, { type: 'highpass', freq: 1500, vol: .9, at: t });
    noise(2.8, { freq: 600, to: 80, vol: .9, at: t + .05 });
    noise(2.2, { freq: 300, to: 60, vol: .7, at: t + .7 });
    tone(55, 2, { type: 'sine', to: 30, vol: .5, at: t });
  },
  rumble() { noise(1.2, { freq: 200, to: 50, vol: 1 }); tone(45, 1, { type: 'sine', to: 28, vol: .7 }); },
  holy() { const t = now(); [72, 76, 79, 83, 86, 91].forEach((m, i) => tone(mf(m), 2.2 - i * .2, { type: 'sine', vol: .09, at: t + i * .12 })); }
};
const SONGS = {
  king:    { bpm: 152, bass: [45,45,57,45, 45,45,56,45, 45,45,57,45, 44,44,56,44],
             lead: [69,0,0,72, 0,0,71,0, 69,0,68,0, 69,0,0,0, 76,0,0,74, 0,0,72,0, 71,0,72,0, 68,0,0,0] },
  wicked:  { bpm: 172, bass: [40,40,52,40, 41,41,53,41, 40,40,52,40, 46,46,58,46],
             lead: [76,0,77,0, 76,0,0,0, 82,0,81,0, 77,0,76,0, 74,0,76,0, 77,0,0,0, 70,0,71,0, 64,0,0,0] },
  golem:   { bpm: 116, bass: [36,0,36,0, 36,0,37,0, 36,0,36,0, 34,0,35,0],
             lead: [60,0,0,0, 61,0,0,0, 60,0,0,0, 58,0,0,0, 0,0,0,0, 63,0,61,0, 60,0,0,0, 0,0,0,0] },
  phantom: { bpm: 164, bass: [43,43,55,43, 43,43,54,43, 41,41,53,41, 42,42,54,42],
             lead: [67,0,70,0, 74,0,73,0, 70,0,67,0, 66,0,0,0, 67,0,70,0, 75,0,74,0, 70,0,69,0, 66,0,0,0] },
  goddess: { bpm: 132, bass: [48,0,55,0, 53,0,55,0, 45,0,52,0, 50,0,55,0],
             lead: [76,0,79,0, 84,0,0,0, 83,0,79,0, 76,0,0,0, 77,0,81,0, 84,0,0,0, 86,0,83,0, 79,0,0,0] },
  // 絶望：遅く低い持続音と、遠くで鳴る鐘
  creator: { bpm: 56, drone: true,
             bass: [33,0,0,0, 0,0,0,0, 32,0,0,0, 0,0,0,0, 33,0,0,0, 0,0,0,0, 29,0,0,0, 30,0,0,0],
             lead: [0,0,0,0, 69,0,0,0, 0,0,68,0, 0,0,0,0, 0,0,0,0, 64,0,0,0, 0,0,63,0, 0,0,0,0] }
};
function startMusic(name) {
  stopMusic(); const a = ac(); const song = SONGS[name];
  const spb = 60 / song.bpm / 4; let step = 0, next = a.currentTime + .1;
  seq = setInterval(() => {
    while (next < a.currentTime + .15) {
      const b = song.bass[step % song.bass.length], l = song.lead[step % song.lead.length];
      if (song.drone) {
        if (b) { tone(mf(b), spb * 8, { type: 'sawtooth', vol: .13, at: next, dest: musicGain }); tone(mf(b + 7), spb * 8, { type: 'sine', vol: .1, at: next, dest: musicGain }); }
        if (l) { tone(mf(l), spb * 6, { type: 'sine', vol: .12, at: next, dest: musicGain }); tone(mf(l) * 2.01, spb * 3, { type: 'sine', vol: .04, at: next, dest: musicGain }); }
        if (step % 16 === 0) tone(60, .5, { type: 'sine', to: 30, vol: .6, at: next, dest: musicGain });
        next += spb; step++; continue;
      }
      if (b) tone(mf(b), spb * .9, { type: 'sawtooth', vol: .11, at: next, dest: musicGain });
      if (l) tone(mf(l), spb * 2.6, { type: name === 'goddess' ? 'triangle' : 'square', vol: name === 'goddess' ? .09 : .055, at: next, dest: musicGain });
      if (step % 4 === 0) tone(150, .14, { type: 'sine', to: 40, vol: .5, at: next, dest: musicGain });
      if (step % 8 === 4) noise(.12, { type: 'highpass', freq: 1500, vol: .2, at: next, dest: musicGain });
      if (step % 2 === 0) noise(.03, { type: 'highpass', freq: 7000, vol: .06, at: next, dest: musicGain });
      next += spb; step++;
    }
  }, 25);
}
function stopMusic() { if (seq) { clearInterval(seq); seq = null; } }
$('#mute').onclick = () => {
  muted = !muted; ac(); master.gain.value = muted ? 0 : 0.6;
  $('#mute').textContent = muted ? '🔇' : '🔊';
};

function monPal() {
  const h = R(0, 359);
  return { o: '#0a0a12', b: `hsl(${h},65%,55%)`, d: `hsl(${h},65%,33%)`, a: `hsl(${(h + 160) % 360},90%,62%)`, w: '#fff', k: '#000', r: '#ff3b3b', y: '#ffd84a' };
}
function draw(cv, map, pal, scale) {
  cv.width = 16 * scale; cv.height = 16 * scale;
  const c = cv.getContext('2d'); c.clearRect(0, 0, cv.width, cv.height);
  map.forEach((row, y) => {
    row = row.padEnd(16, '.').slice(0, 16);
    for (let x = 0; x < 16; x++) {
      const col = pal[row[x]]; if (!col) continue;
      c.fillStyle = col; c.fillRect(x * scale, y * scale, scale, scale);
    }
  });
  return cv;
}
const mkCv = (map, pal, scale) => draw(document.createElement('canvas'), map, pal, scale);

function renderHero(dead) {
  const b = hero.base;
  $('#heroName').textContent = hero.title;
  draw($('#heroCv'), SPR.hero, dead ? grayPal(PAL.hero) : PAL.hero, 3);
  $('#hpTxt').textContent = `HP ${Math.max(0, hero.hp)} / ${hero.maxhp}`;
  const r = Math.max(0, hero.hp / hero.maxhp);
  const bar = $('#hpBar'); bar.style.width = (r * 100) + '%'; bar.classList.toggle('low', r < 0.3);
  const wp = sum(hero.weapons), ap = sum(hero.armors);
  $('#heroStats').innerHTML = KEYS.map(k => {
    let plus = '';
    if (k === 'atk' && wp) plus = `<span class="plus">+${wp}</span>`;
    if (k === 'def' && ap) plus = `<span class="plus">+${ap}</span>`;
    return `<div><span>${LABEL[k]}</span><span><span class="v">${b[k]}</span>${plus}</span></div>`;
  }).join('');
  const eq = [...hero.weapons, ...hero.armors];
  $('#equipTxt').textContent = (eq.length ? '装備：' + eq.map(i => `${i.name}(+${i.bonus})`).join('、') : '装備：なし') +
    (hero.totems ? `　🗿トーテム ×${hero.totems}` : '');
  const al = $('#allies'); al.innerHTML = '';
  if (hero.allies.length) {
    al.append('仲間：');
    hero.allies.forEach(a => {
      const d = document.createElement('span'); d.className = 'al';
      d.append(mkCv(SPR[a.type], a.pal, 1.5), a.name); al.append(d);
    });
  }
}
async function say(t, cls = '') {
  msgLines.push({ t, cls });
  while (msgLines.length > 5) msgLines.shift();
  $('#msg').innerHTML = msgLines.map(l => `<p class="${l.cls}">${l.t}</p>`).join('') +
    `<button id="speed">${fast ? '速さ：はやい' : '速さ：ふつう'}</button>`;
  $('#speed').onclick = () => { SFX.click(); fast = !fast; $('#speed').textContent = fast ? '速さ：はやい' : '速さ：ふつう'; };
  await sleep(fast ? 170 : 520);
}
function setControls(btns) {
  const c = $('#controls'); c.innerHTML = '';
  c.className = btns.length === 1 ? 'one' : '';
  btns.forEach(([html, fn, cls]) => {
    const b = document.createElement('button'); b.innerHTML = html; if (cls) b.className = cls;
    b.onclick = () => { SFX.click(); fn(); }; c.append(b);
  });
}

async function birth() {
  setControls([]);
  const final = rollHero();
  // 0.0001%の奇跡：特別な勇者
  let special = null;
  const fb = force.startsWith('born-') ? force.slice(5) : '';
  if (fb) force = '';
  for (const sb of SPECIAL_BIRTHS) if (fb === sb.key || Math.random() < CFG.specialBirthRate) { special = sb; break; }
  if (special) final[special.stat] = 10000;
  await say('勇者が 誕生しようとしている…！');
  const t0 = Date.now();
  while (Date.now() - t0 < 1400) {
    KEYS.forEach(k => hero.base[k] = rollStat());
    hero.maxhp = hero.hp = hero.base.hp; renderHero(); SFX.tick(); await sleep(50);
  }
  hero.base = final; hero.maxhp = hero.hp = final.hp; hero.title = special ? special.title : '勇者';
  if (special) {
    $('#dim').style.opacity = .8; await sleep(500);
    SFX.sage(); await lightning(); quake();
    $('#dim').style.opacity = 0;
    renderHero();
    await say('―― 奇跡が 起きた！！ ――', 'gold');
    await say(`勇者は「${special.title}」として 生まれた！ ${LABEL[special.stat]} 10000！`, 'gold');
  } else { renderHero(); SFX.join(); }
  fx($('#heroPanel'), 'blink');
  const gifts = KEYS.filter(k => final[k] > CFG.lowMax);   // 10%の「当たり」を引いたステータス
  const best = KEYS.reduce((a, k) => final[k] > final[a] ? k : a, 'hp');
  const worst = KEYS.reduce((a, k) => final[k] < final[a] ? k : a, 'hp');
  const rank = ['…だいじょうぶか この勇者', 'きらりと 光る ものがある 若者', 'なかなかの 逸材', '伝説級の 天才', '神に 愛された 勇者', '神に 愛された 勇者', '奇跡の 申し子'][gifts.length];
  await say(`勇者が 誕生した！ 評価：${rank}`, 'gold');
  if (gifts.length) await say(`才能が 開花した ステータス：${gifts.map(k => LABEL[k]).join('・')}`, 'good');
  await say(`いちばんの取り柄は ${LABEL[best]}（${final[best]}）。いちばんの弱点は ${LABEL[worst]}（${final[worst]}）。`);
  game = { n: R(CFG.cardsMin, CFG.cardsMax), idx: 0, res: [] };
  await say(`魔王までの カードは ${game.n}枚。最後の1枚が 魔王だ。`);
  setControls([
    [`旅に出る<small>カード ${game.n}枚</small>`, deckView, 'red'],
    ['もう一度 誕生する<small>ステータスを 引き直す</small>', birth]
  ]);
  $('#controls').className = 'two';
}

// ===== カード =====
function deckView() {
  busy = false; calm();
  $('#stage').className = 'win'; $('#stage').style.background = '';
  const deck = Array.from({ length: game.n }, (_, i) => {
    const king = i === game.n - 1, done = i < game.idx, cur = i === game.idx, m = game.res[i];
    const label = done ? m : (king ? '魔' : '');
    return `<div class="mc ${king ? 'king' : ''} ${done ? 'done' : ''} ${cur ? 'cur' : ''} ${m === '裏' ? 'w' : ''}">${label}</div>`;
  }).join('');
  const isKing = game.idx === game.n - 1;
  $('#stage').innerHTML = `<div class="center">
    <div class="note">カード ${game.idx + 1} / ${game.n}${isKing ? '　…最後のカードだ' : ''}</div>
    <div class="card ${isKing ? 'kingcard' : ''}" id="bigCard"><div class="in">
      <div class="b">${isKing ? '魔' : '？'}</div><div class="f" id="cardFront"></div>
    </div></div>
    <div class="deck">${deck}</div></div>`;
  setControls([['カードをめくる', flip, isKing ? 'red' : '']]);
}

function rollRare() {
  if (RARE[force]) return force;
  for (const k of Object.keys(RARE)) if (Math.random() < CFG.rareRate) return k;
  return null;
}
async function flip() {
  if (busy) return; busy = true; setControls([]);
  if (force === 'creator') { force = ''; return creatorRises(); } // テスト用 #creator
  const card = $('#bigCard');
  const isKing = game.idx === game.n - 1;
  const rareKey = isKing ? null : rollRare();
  if (force === 'sage' || force === 'totem') game.forceItem = force;   // テスト用：最初に倒した敵から確定
  force = '';
  enemy = isKing ? makeKing() : rareKey ? makeRare(rareKey) : makeMonster();
  const fcv = mkCv(SPR[enemy.type], enemy.pal, 6);
  if (enemy.rare && enemy.rare.ghostly) fcv.classList.add('ghostly');
  $('#cardFront').append(fcv);
  $('#cardFront').insertAdjacentHTML('beforeend', `<div style="font-size:11px;margin-top:4px">${enemy.name}</div>`);

  if (isKing) {
    $('#dim').style.opacity = .7;
    await say('…空気が 重い。', 'dmg');
    await sleep(1200);
    $('#dim').style.opacity = 0;
    SFX.flip(); card.classList.add('flipped');
    await sleep(700); quake(); SFX.thunder();
  } else {
    // ふだんのカード：ほんの少し ためる
    fx(card, 'tremble');
    for (let i = 0; i < 3; i++) { SFX.suspense(i); await sleep(110); }
    SFX.flip(); card.classList.add('flipped');
    await sleep(rareKey ? 500 : 800);
    if (rareKey) await rareEntrance(enemy.rare);
  }
  startBattle();
}
async function rareEntrance(r) {
  const dim = $('#dim');
  if (r.entrance === 'thunder') {
    dim.style.opacity = .85; SFX.thunder(); await lightning(); quake();
    await sleep(400); SFX.thunder(); await lightning(); dim.style.opacity = 0;
  } else if (r.entrance === 'thunder1') {
    dim.style.opacity = .85; SFX.thunder(); await lightning(); quake(); await sleep(500); dim.style.opacity = 0;
  } else if (r.entrance === 'quake') {
    dim.style.opacity = .6; for (let i = 0; i < 3; i++) { SFX.rumble(); quake(); await sleep(750); } dim.style.opacity = 0;
  } else if (r.entrance === 'holy') {
    const b = $('#bolt'); SFX.holy(); b.style.transition = 'opacity 1.4s'; b.style.opacity = .9;
    await sleep(350); b.style.opacity = 0; await sleep(1400); b.style.transition = '';
  }
  await say(r.intro[0], r.txt);
}

const PREFIX = ['ダーク', 'メタル', 'ほのおの', 'こおりの', 'どくの', 'でんげき', 'さまよう', 'くさった', 'ちいさな', 'ふるびた', 'あやしい', 'まぼろしの', 'ねむたげな', 'おこりんぼ'];
const BASE = { slime: 'スライム', bat: 'バット', skull: 'スケルトン', golem: 'ゴーレム', eye: 'アイボール', ghost: 'ゴースト' };
function makeMonster() {
  const type = pick(Object.keys(BASE));
  const s = {}; KEYS.forEach(k => s[k] = R(CFG.monMin, CFG.monMax));
  const total = KEYS.reduce((a, k) => a + s[k], 0);
  return { ...s, maxhp: s.hp, type, pal: monPal(), name: (total > 4500 ? 'ギガ' : '') + pick(PREFIX) + BASE[type], boss: null, rare: null };
}
const KINGNAMES = ['魔王ゾルヴァーグ', '魔王ネクロディア', '魔王バルザード', '魔王グラムドス', '魔王シェルヴァン'];
function makeKing() {
  const s = {}; KEYS.forEach(k => s[k] = R(CFG.kingMin, CFG.kingMax));
  return { ...s, maxhp: s.hp, type: 'king', pal: PAL.king, name: pick(KINGNAMES), boss: 'king', rare: null };
}
function makeRare(key) {
  const r = typeof key === 'string' ? RARE[key] : key; const s = r.stats();
  return { ...s, maxhp: s.hp, type: r.sprite, pal: PAL[r.pal], name: r.name, boss: r === CREATOR ? 'creator' : key, rare: r };
}

// ===== 戦闘 =====
function startBattle() {
  const e = enemy, r = e.rare;
  $('#stage').className = 'win' + (e.boss === 'king' ? ' king' : '');
  $('#stage').style.background = r ? r.bg : '';
  $('#stage').innerHTML = `
    ${e.boss ? `<div class="warn ${r && r.txt === 'gray' ? 'gray' : ''}" id="warn" style="${r ? 'color:' + rColor(r) : ''}">${r && r.warn ? r.warn : '⚠ WARNING ⚠'}</div>` : ''}
    <div class="ebox" style="${e.boss ? 'margin-top:24px' : ''}">
      <div class="ename ${e.boss === 'king' ? 'k' : ''}" style="${r ? 'color:' + rColor(r) : ''}">${e.name}</div>
      <div class="hpbar"><i id="eHp" style="width:100%"></i></div>
    </div>
    <div id="eWrap" style="margin:10px 0"></div>
    <div class="estats ebox">${KEYS.map(k => `<span>${SHORT[k]} <b id="es_${k}">${e[k]}</b></span>`).join('')}</div>`;
  const cv = mkCv(SPR[e.type], e.pal, e.boss ? 10 : 8);
  if (r && r.ghostly) cv.classList.add('ghostly');
  $('#eWrap').append(cv);
  renderEnemy();
  if (e.boss) {
    document.body.style.setProperty('--tc', r ? r.tc : 'rgba(255,0,0,.55)');
    document.body.classList.add('tense');
    startMusic(r ? r.song : 'king');
    if (e.boss !== 'creator') setTimeout(() => { const w = $('#warn'); if (w) w.remove(); }, 2600);
  }
  if (e.boss === 'creator') {
    for (let i = 0; i < 18; i++) {
      const a = document.createElement('div'); a.className = 'ash';
      a.style.left = R(0, 100) + '%'; a.style.animationDuration = R(40, 90) / 10 + 's'; a.style.animationDelay = -R(0, 80) / 10 + 's';
      $('#stage').append(a);
    }
  }
  (async () => {
    if (e.boss === 'king') await say(`${e.name}が 姿を あらわした！`, 'dmg');
    else if (r) { await say(r.intro[1], r.txt); await say(r.intro[2], r.txt); }
    else await say(`${e.name}が あらわれた！`);
    battleControls();
  })();
}
function renderEnemy() {
  const r = Math.max(0, enemy.hp / enemy.maxhp);
  $('#eHp').style.width = (r * 100) + '%'; $('#eHp').classList.toggle('low', r < 0.3);
  const el = $('#es_hp'); if (el) el.textContent = `${Math.max(0, enemy.hp)}/${enemy.maxhp}`;
}
const recruitChance = () => CFG.recruitMin + (CFG.recruitMax - CFG.recruitMin) * Math.min(1, hero.base.luk / CFG.recruitLuck);
function battleControls() {
  busy = false;
  setControls([
    ['殴る<small>攻撃力</small>', () => act('hit')],
    ['魔法<small>魔力</small>', () => act('magic')],
    [`仲間にする<small>${enemy.boss ? '無理そうだ' : (recruitChance() * 100).toFixed(2) + '%'}</small>`, () => act('recruit')]
  ]);
}
function physical(atk, def, luk) {
  let d = atk * atk / (atk + def * CFG.defPower) * (0.9 + Math.random() * 0.2);
  const crit = Math.random() < lk(luk) * 0.2;
  if (crit) d *= 2;
  return { dmg: Math.max(1, Math.round(d)), crit };
}
function magical(mag, mdf) {
  return Math.max(1, Math.round(mag * mag / (mag + mdf) * (0.7 + Math.random() * 0.7)));
}
function hitEnemy(dmg) {
  enemy.hp -= dmg; renderEnemy();
  fx($('#eWrap canvas'), 'shake');
}

async function act(kind) {
  if (busy) return; busy = true; setControls([]);
  const e = enemy;
  if (kind === 'hit') {
    await say('勇者の こうげき！');
    const { dmg, crit } = physical(atkOf(), e.def, hero.base.luk);
    crit ? SFX.crit() : SFX.hit();
    hitEnemy(dmg); popup(dmg, crit ? 'crit' : '');
    if (crit) await say('かいしんの いちげき！', 'gold');
    await say(`${e.name}に ${dmg}の ダメージ！`);
  } else if (kind === 'magic') {
    await say(`勇者は ${pick(['ファイア', 'ブリザド', 'サンダー', 'メテオ', 'ダークボルト'])}を となえた！`);
    SFX.magic();
    const dmg = magical(hero.base.mag, e.mdf);
    hitEnemy(dmg); popup(dmg, 'mag');
    await say(`${e.name}に ${dmg}の ダメージ！`);
  } else {
    SFX.talk();
    await say(`勇者は ${e.name}を 仲間に さそった。`);
    if (e.boss === 'king') {
      await say(pick(['魔王「笑わせるな、ちっぽけな勇者よ。」', '魔王「言葉など 無意味だ。」', '魔王「…その度胸だけは 認めてやろう。」']));
    } else if (e.rare) {
      await say(pick(e.rare.refuse), e.rare.txt);
    } else if (Math.random() < recruitChance()) {
      await say(`なんと ${e.name}が 仲間に なりたそうに こちらを見ている！`, 'gold');
      if (hero.allies.length < CFG.maxAllies) {
        SFX.join(); hero.allies.push(e); renderHero();
        await say(`${e.name}が 仲間に なった！`, 'good');
      } else {
        await say(`しかし パーティは いっぱいだ。${e.name}は 手を振って 去っていった。`);
      }
      return finishCard('仲');
    } else {
      await say(pick([`${e.name}は きょとんと している。`, `${e.name}は 話を 聞いていない！`, `${e.name}は 鼻で 笑った。`, `${e.name}は 少し 考えたが ことわった。`, `${e.name}は あくびを した。`]));
    }
  }
  if (e.hp <= 0) return victory();

  for (const a of hero.allies) {
    await say(`仲間の ${a.name}の こうげき！`);
    const { dmg, crit } = physical(a.atk, e.def, a.luk);
    crit ? SFX.crit() : SFX.hit();
    hitEnemy(dmg); popup(dmg, crit ? 'crit' : '');
    await say(`${e.name}に ${dmg}の ダメージ！`);
    if (e.hp <= 0) return victory();
  }

  await enemyTurn();
  if (hero.hp <= 0 && !(await tryRevive())) return defeat();
  battleControls();
}

async function enemyTurn() {
  const e = enemy, r = e.rare;
  if (r && Math.random() < r.idle) { await say(rText(r), r.txt); return; }
  const useMag = e.mag > e.atk ? Math.random() < 0.75 : Math.random() < 0.25;
  let dmg;
  if (useMag) {
    const spell = e.boss === 'king' ? pick(['ヘルフレイム', '終焉の雷', '暗黒の波動'])
      : r ? pick(r.spells) : pick(['あやしい光', 'どくの霧', 'こおりの息', 'ほのおの玉']);
    await say(`${e.name}は ${spell}を はなった！`, r ? r.txt : '');
    if (e.boss === 'creator') { SFX.rumble(); SFX.holy(); lightning(); }
    else if (r && r.entrance.startsWith('thunder')) { SFX.thunder(); lightning(); } else SFX.magic();
    dmg = magical(e.mag, hero.base.mdf);
  } else {
    await say(r ? pick(r.phys) : `${e.name}の こうげき！`, r ? r.txt : '');
    const res = physical(e.atk, defOf(), e.luk);
    dmg = res.dmg;
    if (res.crit) await say('つうこんの いちげき！', 'dmg');
  }
  SFX.hurt();
  hero.hp -= dmg; renderHero();
  fx($('#heroPanel'), 'flash');
  if (e.boss) quake();
  await say(`勇者は ${dmg}の ダメージを うけた！`, 'dmg');
}

async function victory() {
  const e = enemy;
  calm();
  const cv = $('#eWrap canvas'); cv.style.transition = 'opacity .6s'; cv.style.opacity = 0;
  hero.kills++;
  if (e.boss === 'creator') {
    hero.creatorDown = true;
    await say('…世界の創造神が 崩れ落ちていく。', 'gray');
    await sleep(800); SFX.win();
    await say('ありえない。勇者は 神を こえた。', 'gold');
    return ending();
  }
  SFX.win();
  await say(`${e.name}を たおした！`, 'good');
  if (e.boss === 'king') return creatorRises();
  if (e.rare) {
    hero.rareDown.push(e.name);
    await say('裏ボスを たおした！ 伝説の 装備が 残されている…', e.rare.txt);
    await giveItem({ legend: true });
  } else {
    await rewardDrop(e);
  }
  finishCard(e.rare ? '裏' : '討');
}

// 敵を倒したあと：70%でアイテム（うち1%で賢者シリーズ、それ以外は トーテム1%・残りをポーション/剣/防具で等分）
async function rewardDrop(e) {
  const f = game.forceItem; game.forceItem = '';
  if (!f && Math.random() >= CFG.dropRate) return;
  if (f === 'sage' || (!f && Math.random() < CFG.sageRate)) {
    // 賢者シリーズ：暗転し、光と鼓動が高まる
    $('#dim').style.opacity = .65;
    const glow = showItem(document.createElement('span'), '<div class="big" style="font-size:44px;animation:blink .5s infinite">？</div>', true);
    await say(`…${e.name}の いた場所が まばゆく 光りはじめた！`, 'gold');
    for (let i = 0; i < 5; i++) { SFX.rise(i); await sleep(560 - i * 70); }
    await say('な、なにかが 起きる…！', 'gold');
    await sleep(400);
    glow.remove(); $('#dim').style.opacity = 0;
    return giveItem({ sage: true });
  }
  await say(`${e.name}は 何かを 落としていった！`, 'gold');
  const kind = (f === 'totem' || Math.random() < CFG.totemRate) ? 'totem' : pick(['potion', 'weapon', 'armor']);
  if (kind === 'totem') return giveTotem();
  if (kind === 'potion') return givePotion();
  return giveItem({ kind });
}

// 魔王を倒したあと：絶望の演出で 世界の創造神が あらわれる
async function creatorRises() {
  game.res[game.idx] = '討';
  await sleep(900);
  await say('…世界に 光が もどる はずだった。', 'gray');
  const dim = $('#dim'); dim.style.transition = 'opacity 2.5s'; dim.style.opacity = .92;
  SFX.rumble();
  await sleep(1200);
  await say('空が 白く ひび割れていく。', 'gray');
  document.body.classList.add('despair');
  startMusic('creator');
  for (let i = 0; i < 3; i++) { SFX.heart(); await sleep(1300 + i * 300); }
  await say('鼓動が… 遅く なっていく…', 'gray');
  await sleep(900);
  const b = $('#bolt'); b.style.transition = 'opacity 3s'; b.style.opacity = 1; SFX.holy();
  await sleep(600);
  dim.style.opacity = 0; b.style.opacity = 0;
  enemy = makeRare(CREATOR);
  startBattle();
  await sleep(3000);
  dim.style.transition = ''; b.style.transition = '';
}
async function finishCard(mark) {
  game.res[game.idx] = mark; game.idx++;
  const heal = Math.ceil(hero.maxhp * CFG.healRate);
  if (hero.hp < hero.maxhp) {
    hero.hp = Math.min(hero.maxhp, hero.hp + heal); renderHero();
    await say(`ひと休みして HPが ${heal} 回復した。`);
  }
  setControls([['つぎへ', deckView]]);
}

// ===== アイテム =====
const TIER = [[100, ['木の', '銅の', 'さびた']], [1000, ['鉄の', '鋼の', '銀の']], [5000, ['ミスリルの', '竜の', '聖なる']], [Infinity, ['伝説の', '神々の', '星くずの']]];
function showItem(cv, html, sage) {
  const ov = document.createElement('div'); ov.className = 'itemget' + (sage ? ' sage' : '');
  ov.append(cv); ov.insertAdjacentHTML('beforeend', html);
  $('#stage').append(ov); return ov;
}
async function giveItem(o = {}) {
  const kind = o.kind || (Math.random() < 0.5 ? 'weapon' : 'armor');
  const weapon = kind === 'weapon';
  let bonus, name;
  if (o.sage) {
    bonus = CFG.sageBonus; name = weapon ? '賢者の剣' : '賢者の防具';
  } else {
    bonus = o.legend ? R(5000, CFG.itemMax) : Math.round(CFG.itemMin * Math.pow(CFG.itemMax / CFG.itemMin, Math.random()));
    name = pick(TIER.find(t => bonus < t[0])[1]) + (weapon ? pick(['つるぎ', 'おの', 'やり', 'ハンマー']) : pick(['たて', 'よろい', 'かぶと', 'マント']));
  }
  (weapon ? hero.weapons : hero.armors).push({ name, bonus });
  const pal = o.sage ? (weapon ? PAL.sageSword : PAL.sageShield) : (weapon ? PAL.sword : PAL.shield);
  const ov = showItem(mkCv(weapon ? SPR.sword : SPR.shield, pal, o.sage ? 7 : 5),
    `<div>${o.sage ? '✦ ' + name + ' ✦' : name}</div><div style="color:var(--green)">${weapon ? '攻撃力' : '防御力'} +${bonus}</div>`, o.sage);
  if (o.sage) { SFX.sage(); fx($('#heroPanel'), 'blink'); } else SFX.item();
  renderHero();
  if (o.sage) await say(`${name}を 手に入れた！！ ${weapon ? '攻撃力' : '防御力'}が ${bonus} 上がった！`, 'gold');
  else await say(`${name}を 手に入れた！ ${weapon ? '攻撃力' : '防御力'}が ${bonus} 上がった！`, 'gold');
  await sleep(o.sage ? 2200 : (fast ? 600 : 1300));
  ov.remove();
}
async function giveTotem() {
  hero.totems++;
  const ov = showItem(mkCv(SPR.totem, PAL.totem, 5), `<div>復活のトーテム</div><div style="color:var(--green)">一度だけ よみがえる</div>`);
  SFX.item(); renderHero();
  await say('復活のトーテムを 手に入れた！ たおれても 一度だけ よみがえる。', 'gold');
  await sleep(fast ? 600 : 1300);
  ov.remove();
}
// HPが0になったとき：トーテムがあれば消費して全回復
async function tryRevive() {
  if (hero.totems <= 0) return false;
  hero.totems--; hero.revived++;
  await say('勇者は たおれた…', 'dmg');
  await sleep(500);
  const ov = showItem(mkCv(SPR.totem, PAL.totem, 6), `<div>復活のトーテムが 砕け散った！</div>`, true);
  const t = now(); [60, 64, 67, 72, 76, 79, 84].forEach((m, i) => tone(mf(m), .35, { type: 'triangle', vol: .13, at: t + i * .09 }));
  noise(.6, { type: 'highpass', freq: 3000, vol: .1, at: t + .5 });
  hero.hp = hero.maxhp; renderHero(); fx($('#heroPanel'), 'healfx');
  await say('復活のトーテムが 砕け散った！ 勇者は よみがえった！', 'good');
  await sleep(fast ? 500 : 1100);
  ov.remove();
  return true;
}
async function givePotion() {
  const v = R(CFG.potionMin, CFG.potionMax);
  const heal = Math.min(v, hero.maxhp - hero.hp);
  const ov = showItem(mkCv(SPR.potion, PAL.potion, 5), `<div>回復ポーション</div><div style="color:var(--green)">回復量 ${v}</div>`);
  SFX.heal();
  hero.hp += heal; renderHero(); fx($('#heroPanel'), 'healfx');
  await say('回復ポーションを 手に入れた！ さっそく 飲んだ。', 'good');
  await say(heal > 0 ? `HPが ${heal} 回復した！` : 'でも HPは もう 満タンだった…', 'good');
  await sleep(fast ? 400 : 900);
  ov.remove();
}

// ===== 結末 =====
const summary = () => `討伐 ${hero.kills}体 ／ 仲間 ${hero.allies.length}体 ／ 装備 ${hero.weapons.length + hero.armors.length}個` +
  (hero.rareDown.length ? `<br>★ 裏ボス撃破：${hero.rareDown.join('、')} ★` : '');
async function ending() {
  $('#stage').className = 'win'; $('#stage').style.background = '';
  $('#stage').innerHTML = `<div class="center"><div class="big">GAME CLEAR</div></div>`;
  const c = $('#stage .center');
  c.append(mkCv(SPR.hero, PAL.hero, 7));
  $('#stage .big').textContent = 'TRUE END';
  c.insertAdjacentHTML('beforeend', `<div class="note">魔王も 創造神も たおれ、<br>世界は 勇者の 手に 委ねられた。<br>${summary()}</div>`);
  await say('勇者は 神話に なった！', 'gold');
  setControls([['もう一度 誕生する', title, 'red']]);
}
async function defeat() {
  const byCreator = enemy.boss === 'creator';
  calm(); renderHero(true); SFX.lose();
  await say('勇者は たおれた…', 'dmg');
  if (byCreator) await say('そして 世界は 静かに 無へと 還った。', 'gray');
  $('#stage').className = 'win dead'; $('#stage').style.background = '';
  $('#stage').innerHTML = `<div class="center"><div class="big" style="color:var(--red)">GAME OVER</div></div>`;
  const c = $('#stage .center');
  c.append(mkCv(SPR.hero, PAL.hero, 7));
  c.insertAdjacentHTML('beforeend', `<div class="note">${byCreator ? '魔王を 倒した その先で 力つきた。' : `カード ${game.idx + 1} / ${game.n} 枚目で 力つきた。`}<br>相手：${enemy.name}<br>${summary()}</div>`);
  setControls([['生まれ変わる', title, 'red']]);
}

title();
</script>
